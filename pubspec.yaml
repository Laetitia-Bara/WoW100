name: wow100
description: "WoW100 is a Flutter application that helps users track their progress in World of Warcraft. It provides features for tracking various in-game activities, such as quests, achievements, and character progression. The app is designed to be user-friendly and visually appealing, making it easy for players to stay organized and motivated in their WoW journey."
publish_to: "none"
version: 1.0.8+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.3.5
  http: ^1.2.2
  web: ^1.1.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  purchases_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/app_icon/wow100_app_icon_2026.png"
  image_path_android: "assets/app_icon/wow100_app_icon_android_rounded_2026.png"
  adaptive_icon_background: "#642867"
  adaptive_icon_foreground: "assets/app_icon/wow100_app_icon_android_rounded_2026.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/data/metadata/mounts_metadata.json
    - assets/data/metadata/mounts_wowhead_overrides.json
    - assets/data/routes/
    - assets/data/pets/
    - assets/data/achievements/
    - assets/generated/achievements_wow100_draft.json
    - assets/generated/locations_reference_catalog.json
    - assets/generated/mamytwink_mount_candidates.json
    - assets/generated/mounts_catalog_enriched.json
    - assets/generated/mounts_metadata_mamytwink_draft.json
    - assets/generated/mounts_reference_catalog.json
    - assets/generated/pets_wow100_draft.json
    - assets/images/google_g_logo.png
    - assets/images/bann/bann_perso_alliance.png
    - assets/images/bann/bann_perso_horde.png
    - assets/images/expansions/bann_bfa.jpg
    - assets/images/expansions/bann_dreanor.jpg
    - assets/images/expansions/cataclysm.jpg
    - assets/images/expansions/dragonflight.jpg
    - assets/images/expansions/legion.jpg
    - assets/images/expansions/midnight.jpg
    - assets/images/expansions/mop.jpg
    - assets/images/expansions/shadow.jpg
    - assets/images/expansions/tbc.jpg
    - assets/images/expansions/tww.jpg
    - assets/images/expansions/vanilla.jpg
    - assets/images/expansions/wrath.jpg
    - assets/images/icones/campaign_quest_icon_native.png
    - assets/images/icones/hf_points_flower_badge.png
    - assets/images/icones/icone192.png
    - assets/images/icones/mythic_keystone_icon.png
    - assets/images/icones/wallpaper_alliance.png
    - assets/images/icones/wallpaper_app.jpg
    - assets/images/icones/wallpaper_horde.png
